spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spels}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Defina JWT_SECRET em produção com pelo menos 32 caracteres aleatórios.
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
jwt.expiration=900000

# Origem padrão do servidor de desenvolvimento Angular; altere com CORS_ALLOWED_ORIGIN quando necessário.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Opcional: cria ou promove o primeiro administrador na inicialização.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:Administrator}
app.subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:14}
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
