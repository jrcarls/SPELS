spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/spels}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Defina JWT_SECRET em produção com pelo menos 32 caracteres aleatórios.
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
jwt.expiration=900000

# Origem padrão do Vite/React; altere com CORS_ALLOWED_ORIGIN quando necessário.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
